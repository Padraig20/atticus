[project]
name = "atticus"
version = "0.1.0"
description = "Genotype preparation and gene embeddings for atticus"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
variantformer = [
    "variantformer",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "flash-attn; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
variantformer = { path = "variantformer", editable = true }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
